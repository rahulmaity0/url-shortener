# Settings used only while tests run.
#
# The database is in memory and thrown away afterwards, so tests never touch
# the real ./data folder and never depend on what a previous run left behind.

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.base-url=http://localhost:9090

logging.level.org.springframework=WARN
