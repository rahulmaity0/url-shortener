server.port=9090

# Used to build the full short URL we hand back, e.g. http://localhost:9090/a3Xf9
app.base-url=http://localhost:9090

spring.datasource.url=jdbc:h2:file:./data/shortener
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Close the database session when the service method ends, rather than keeping
# it open until the response has been written. Spring warns about this on
# startup if you leave it at the default.
spring.jpa.open-in-view=false
